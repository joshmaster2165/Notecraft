# Builds the Notecraft desktop app (Tauri) for macOS, Windows and Linux, plus
# the standalone `notecraft` CLI / MCP server. Push a tag like v0.2.0 to
# publish everything as a GitHub Release; run it manually (Actions › Release
# desktop app › Run workflow) to get the builds as workflow artifacts.
name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: notecraft/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install and test
        working-directory: notecraft
        run: |
          npm ci
          npm test
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: notecraft
          args: --target ${{ matrix.target }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Notecraft ${{ github.ref_name }}
          releaseBody: |
            Installers for macOS (Apple Silicon and Intel), Windows and Linux, and the `notecraft` command-line tool / MCP server for AI agents.
            The macOS app isn't notarized yet: the first time, right-click Notecraft in Applications and choose Open.
          releaseDraft: false
      - name: Attach the CLI
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "notecraft/src-tauri/binaries/notecraft-${{ matrix.target }}$ext" "notecraft-cli-${{ matrix.target }}$ext"
          gh release upload "${{ github.ref_name }}" "notecraft-cli-${{ matrix.target }}$ext" --clobber
      - name: Keep the builds (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: notecraft-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/
            notecraft/src-tauri/binaries/
          if-no-files-found: error
