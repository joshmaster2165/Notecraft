# Builds the Notecraft desktop app for macOS, Windows and Linux.
# Push a tag like v0.2.0 to publish the installers as a GitHub Release;
# run it manually (Actions › Release desktop app › Run workflow) to get
# the installers as workflow artifacts without releasing.
name: Release desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: notecraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: notecraft/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:electron
      - name: Package
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No Apple/Windows signing certificates: macOS builds are ad-hoc signed.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: notecraft-${{ runner.os }}
          if-no-files-found: error
          path: |
            notecraft/release/*.dmg
            notecraft/release/*.zip
            notecraft/release/*.exe
            notecraft/release/*.AppImage
            notecraft/release/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
          body: |
            ## Download
            - **macOS (Apple Silicon):** `Notecraft-*-mac-arm64.dmg`
            - **macOS (Intel):** `Notecraft-*-mac-x64.dmg`
            - **Windows:** `Notecraft-*-win-x64.exe` (or `arm64`)
            - **Linux:** `.AppImage` or `.deb`

            The macOS app isn't notarized. The first time, right-click Notecraft in Applications and choose **Open**,
            or run `xattr -dr com.apple.quarantine /Applications/Notecraft.app`.
