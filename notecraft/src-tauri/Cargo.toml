[package]
name = "notecraft-desktop"
version = "0.2.0"
description = "Notecraft desktop app: a local-first notebook with OneNote's features"
edition = "2021"
repository = "https://github.com/joshmaster2165/Notecraft"
publish = false

[lib]
name = "notecraft_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
notify = "8"
notecraft-core = { path = "../crates/core" }
onenote-re = { path = "../../onenote-re/parser-rs" }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust"] }
